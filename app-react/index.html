<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <!-- Sem maximum-scale/user-scalable=no: bloquear o zoom reprova acessibilidade (WCAG 1.4.4). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      CSP via meta tag porque o deploy é estático (GitHub Pages, sem headers
      HTTP customizados). `frame-ancestors`/`report-uri`/`sandbox` são
      ignorados quando entregues por meta tag (exigem header HTTP de
      verdade) — de propósito fora daqui. style-src precisa de
      'unsafe-inline' pelo style={{...}} do React; img-src precisa de data:
      pelas fotos de progresso recomprimidas em canvas (lib/imageUtils.js) e
      do domínio do Supabase pelas signed URLs do Storage.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://btzdetvoneyhzthsmdrp.supabase.co https://tile.openstreetmap.org; connect-src 'self' https://world.openfoodfacts.org https://api.open-meteo.com https://btzdetvoneyhzthsmdrp.supabase.co wss://btzdetvoneyhzthsmdrp.supabase.co; font-src 'self'; manifest-src 'self'; worker-src 'self'; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'" />
    <script src="boot-module.js"></script>
    <title>EAFIT — Treino</title>
    <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml" />
    <link rel="alternate icon" href="favicon.ico?v=2" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#0e0e12" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="EAFIT" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Plano de treino personalizado, registro de cargas e recordes, hidratação e evolução. Funciona offline e sincroniza entre dispositivos." />
    <!-- Verificação do Google Search Console (propriedade antiga https://elinaldoa.github.io/EAFIT/). Não remover. -->
    <meta name="google-site-verification" content="6cQRe7zIEWx0dtk7vxyHK7CK2cEegNfOY7VaGtOj80k" />

    <!-- Prévia de link (WhatsApp, redes sociais). URLs absolutas: crawlers não resolvem caminho relativo. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="EAFIT" />
    <meta property="og:title" content="EAFIT — Seu treino, sempre com você" />
    <meta property="og:description" content="Plano de treino personalizado, registro de cargas e recordes, hidratação e evolução." />
    <meta property="og:url" content="https://eafit.com.br/app/" />
    <meta property="og:image" content="https://eafit.com.br/app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo do EAFIT com o slogan Seu treino, sempre com você" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Splash estática: aparece enquanto o JS baixa/inicializa (antes era tela
      em branco) e é substituída quando o React renderiza em #root. <style>
      inline é permitido pela CSP (style-src 'unsafe-inline'); script inline
      não, por isso o tema aqui segue só prefers-color-scheme.
    -->
    <style>
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #0e0e12; color: #e4e4e7; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .boot img { width: 88px; height: 88px; border-radius: 22px; }
      .boot__name { font-size: 22px; font-weight: 800; letter-spacing: .12em; }
      /* A splash segue o tema do sistema (fundo escuro ou claro), não o do app. O "EA"
         do Wordmark usa a cor de texto do app (--text) e ficava escuro sobre o fundo
         escuro: aqui ele herda a cor da própria splash. */
      .boot .boot__name .wordmark__ea { color: inherit; -webkit-text-fill-color: currentColor; }
      .boot .dumbbell { width: 88px; line-height: 0; color: #a1a1aa; }
      .boot .dumbbell svg { width: 100%; height: auto; overflow: visible; animation: boot-lift 1.8s ease-in-out infinite; }
      @keyframes boot-lift { 0%, 35% { transform: rotate(0); } 50%, 85% { transform: rotate(180deg); } 100% { transform: rotate(360deg); } }
      /* Módulo Run (data-spinner vem de boot-module.js): corredor no lugar do halter. */
      .boot .boot__runner { display: none; width: 64px; line-height: 0; color: #a1a1aa; }
      .boot .boot__runner svg { width: 100%; height: auto; overflow: visible; }
      .boot .boot__runner path { fill: none; stroke: currentColor; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
      .boot .boot__runner .r-torso { stroke: #f97316; stroke-width: 4.6; }
      .boot .boot__runner .r-head { fill: #f97316; }
      .boot .boot__runner .r-frame { visibility: hidden; animation: boot-frame .6s step-end infinite; }
      .boot .boot__runner .r-frame2 { animation-delay: -.45s; }
      .boot .boot__runner .r-frame3 { animation-delay: -.3s; }
      .boot .boot__runner .r-frame4 { animation-delay: -.15s; }
      @keyframes boot-frame { 0% { visibility: visible; } 25% { visibility: hidden; } }
      html[data-spinner="corrida"] .boot > .dumbbell:not(.dumbbell--runner) { display: none; }
      html[data-spinner="corrida"] .boot > .boot__runner { display: inline-block; }
      @media (prefers-color-scheme: light) { .boot { background: #f4f4f5; color: #18181b; } }
      @media (prefers-reduced-motion: reduce) { .boot .dumbbell svg, .boot .boot__runner .r-frame { animation: none !important; } .boot .boot__runner .r-frame1 { visibility: visible; } }
    </style>
  </head>
  <body>
    <noscript>O EAFIT precisa de JavaScript ativado para funcionar.</noscript>
    <div id="root">
      <div class="boot" role="status" aria-label="Carregando o EAFIT">
        <img src="icon-192.webp" alt="" />
        <div class="boot__name">EA<span style="color:#f97316">FIT</span></div>
        <span class="dumbbell"><svg viewBox="0 0 64 32" aria-hidden="true"><rect x="18" y="14" width="28" height="4" rx="2" fill="currentColor" opacity=".55"/><rect x="14" y="6" width="5" height="20" rx="2" fill="#f97316"/><rect x="45" y="6" width="5" height="20" rx="2" fill="#f97316"/><rect x="8" y="10" width="5" height="12" rx="2" fill="currentColor"/><rect x="51" y="10" width="5" height="12" rx="2" fill="currentColor"/></svg></span>
        <span class="boot__runner"><svg viewBox="0 0 48 44" aria-hidden="true"><g class="r-frame r-frame1" transform="translate(0 -1.2)"><g class="r-far" opacity=".55"><path d="M23 26l-6 7 -9 -2"/><path d="M27 15l5 6 6 -3"/></g><path class="r-torso" d="M28 14l-5 12"/><circle class="r-head" cx="30" cy="7" r="4.2"/><path d="M23 26l8 4 3 9"/><path d="M27 15l-6 5 -5 -5"/></g><g class="r-frame r-frame2" transform="translate(0 0)"><g class="r-far" opacity=".55"><path d="M23 26l5 5 -7 3"/><path d="M27 15l2 6 5 -1"/></g><path class="r-torso" d="M28 14l-5 12"/><circle class="r-head" cx="30" cy="7" r="4.2"/><path d="M23 26l2 8 -2 8"/><path d="M27 15l-1 6 5 2"/></g><g class="r-frame r-frame3" transform="translate(0 -1.2)"><g class="r-far" opacity=".55"><path d="M23 26l8 4 3 9"/><path d="M27 15l-6 5 -5 -5"/></g><path class="r-torso" d="M28 14l-5 12"/><circle class="r-head" cx="30" cy="7" r="4.2"/><path d="M23 26l-6 7 -9 -2"/><path d="M27 15l5 6 6 -3"/></g><g class="r-frame r-frame4" transform="translate(0 0)"><g class="r-far" opacity=".55"><path d="M23 26l2 8 -2 8"/><path d="M27 15l-1 6 5 2"/></g><path class="r-torso" d="M28 14l-5 12"/><circle class="r-head" cx="30" cy="7" r="4.2"/><path d="M23 26l5 5 -7 3"/><path d="M27 15l2 6 5 -1"/></g></svg></span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
