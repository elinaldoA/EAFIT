<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <!-- Sem maximum-scale/user-scalable=no: bloquear o zoom reprova acessibilidade (WCAG 1.4.4). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      CSP via meta tag porque o deploy é estático (GitHub Pages, sem headers
      HTTP customizados). `frame-ancestors`/`report-uri`/`sandbox` são
      ignorados quando entregues por meta tag (exigem header HTTP de
      verdade) — de propósito fora daqui. style-src precisa de
      'unsafe-inline' pelo style={{...}} do React; img-src precisa de data:
      pelas fotos de progresso recomprimidas em canvas (lib/imageUtils.js) e
      do domínio do Supabase pelas signed URLs do Storage.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://btzdetvoneyhzthsmdrp.supabase.co; connect-src 'self' https://btzdetvoneyhzthsmdrp.supabase.co wss://btzdetvoneyhzthsmdrp.supabase.co; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'" />
    <title>EAFIT — Treino</title>
    <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml" />
    <link rel="alternate icon" href="favicon.ico?v=2" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#0e0e12" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="EAFIT" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Plano de treino personalizado, registro de cargas e recordes, hidratação e evolução. Funciona offline e sincroniza entre dispositivos." />
    <!-- Verificação do Google Search Console (propriedade antiga https://elinaldoa.github.io/EAFIT/). Não remover. -->
    <meta name="google-site-verification" content="6cQRe7zIEWx0dtk7vxyHK7CK2cEegNfOY7VaGtOj80k" />

    <!-- Prévia de link (WhatsApp, redes sociais). URLs absolutas: crawlers não resolvem caminho relativo. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="EAFIT" />
    <meta property="og:title" content="EAFIT — Seu treino, sempre com você" />
    <meta property="og:description" content="Plano de treino personalizado, registro de cargas e recordes, hidratação e evolução." />
    <meta property="og:url" content="https://eafit.com.br/app/" />
    <meta property="og:image" content="https://eafit.com.br/app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo do EAFIT com o slogan Seu treino, sempre com você" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Splash estática: aparece enquanto o JS baixa/inicializa (antes era tela
      em branco) e é substituída quando o React renderiza em #root. <style>
      inline é permitido pela CSP (style-src 'unsafe-inline'); script inline
      não, por isso o tema aqui segue só prefers-color-scheme.
    -->
    <style>
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #0e0e12; color: #e4e4e7; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .boot img { width: 88px; height: 88px; border-radius: 22px; }
      .boot__name { font-size: 22px; font-weight: 800; letter-spacing: .12em; }
      .boot .dumbbell { width: 88px; line-height: 0; color: #a1a1aa; }
      .boot .dumbbell svg { width: 100%; height: auto; overflow: visible; animation: boot-lift 1.8s ease-in-out infinite; }
      @keyframes boot-lift { 0%, 35% { transform: rotate(0); } 50%, 85% { transform: rotate(180deg); } 100% { transform: rotate(360deg); } }
      @media (prefers-color-scheme: light) { .boot { background: #f4f4f5; color: #18181b; } }
      @media (prefers-reduced-motion: reduce) { .boot .dumbbell svg { animation: none; } }
    </style>
  </head>
  <body>
    <noscript>O EAFIT precisa de JavaScript ativado para funcionar.</noscript>
    <div id="root">
      <div class="boot" role="status" aria-label="Carregando o EAFIT">
        <img src="icon-maskable-192.png" alt="" />
        <div class="boot__name">EAFIT</div>
        <span class="dumbbell"><svg viewBox="0 0 64 32" aria-hidden="true"><rect x="18" y="14" width="28" height="4" rx="2" fill="currentColor" opacity=".55"/><rect x="14" y="6" width="5" height="20" rx="2" fill="#f97316"/><rect x="45" y="6" width="5" height="20" rx="2" fill="#f97316"/><rect x="8" y="10" width="5" height="12" rx="2" fill="currentColor"/><rect x="51" y="10" width="5" height="12" rx="2" fill="currentColor"/></svg></span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
