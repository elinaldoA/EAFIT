<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>EAFIT — Página não encontrada</title>
  <script>
    // Links antigos (de quando o site ficava em elinaldoa.github.io/EAFIT/, que
    // o GitHub redireciona pra cá sem o /EAFIT): card e convite compartilhados
    // apontam pra /landing/, e-mails e notificações pra /legal/ e /EAFIT/.
    (function () {
      var p = location.pathname;
      var to = '';
      if (p.indexOf('/EAFIT/') === 0) p = p.slice(6);
      if (p.indexOf('/landing') === 0) to = '/';
      else if (p.indexOf('/legal/') === 0) to = '/app' + p;
      else if (p !== location.pathname) to = '/app' + p;
      if (to) location.replace(to + location.search + location.hash);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; background: #0e0e12; color: #e4e4e7; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    h1 { margin: 0; font-size: 1.3rem; }
    p { margin: 0; opacity: .8; }
    a { color: #f97316; font-weight: 700; }
  </style>
</head>
<body>
  <h1>Página não encontrada</h1>
  <p>O endereço que você abriu não existe mais.</p>

</body>
