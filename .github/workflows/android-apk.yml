name: Android APK (teste)

# Gera o APK de debug do app Android (Capacitor) para instalar no celular e testar.
# Baixe em: aba Actions > esta execucao > Artifacts > EAFIT-debug.apk (arquivo .apk direto, sem zip).
# Roda pelo botao "Run workflow" ou quando o projeto Android ou o codigo do app mudam.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app-react/android/**'
      - 'app-react/capacitor.config.json'
      - 'app-react/src/**'
      - 'app-react/package*.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-react/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build do app (modo nativo) e copia para o Android
        working-directory: app-react
        run: |
          npm ci
          npm run build:native
          npx cap sync android
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      - name: Gera o APK de debug
        working-directory: app-react/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # O Health Connect do app e SOMENTE LEITURA (passos, frequencia cardiaca e peso).
      # O plugin declara dezenas de permissoes, inclusive de escrita; o AndroidManifest
      # remove as demais. Se alguma voltar a aparecer no manifesto final, o build falha.
      - name: Confere as permissoes do Health Connect no APK
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump permissions app-react/android/app/build/outputs/apk/debug/app-debug.apk | tee perms.txt
          grep "android.permission.health" perms.txt | sort > health.txt || true
          cat health.txt
          printf '%s\n' \
            "uses-permission: name='android.permission.health.READ_HEART_RATE'" \
            "uses-permission: name='android.permission.health.READ_STEPS'" \
            "uses-permission: name='android.permission.health.READ_WEIGHT'" | sort > esperado.txt
          diff esperado.txt health.txt

      # archive: false envia o .apk sem zip (o nome do artefato vira o nome do arquivo)
      - uses: actions/upload-artifact@v7
        with:
          name: EAFIT-debug.apk
          archive: false
          path: app-react/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
